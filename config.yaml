# web界面设置
server:
  web_listen: "0.0.0.0:8080"

# 解密程序和配置参数设置
wrapper:
  path: "./wrapper"
  state_file: "manager.json"
  # 自动重启进程的日志关键词监控，可以监控多个关键词
  restart_patterns:
    - "KDCanProcessCKC"
    #- "新关键词"

# 账号设置,(wrapper)管理器此处的(ip:端口)对应下载器的(ip:端口)
# 如 us 区域开了3个线程, 填入下方的参数即，解密时就可进行3个线程的负载均衡
cn:
  decrypt-m3u8-port: "0.0.0.0:8001"
  get-m3u8-port: "0.0.0.0:8002"
  get-account-port: "0.0.0.0:8003"
  key-server: "0.0.0.0:8004"

